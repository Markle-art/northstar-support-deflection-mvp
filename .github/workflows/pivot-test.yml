name: Meridian Pivot Test

on:
  workflow_dispatch:

jobs:
  test-pivot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: find . -maxdepth 3 -type f

      - name: Run Pivot prototype
        run: python3 ./pivot-event/app.py
