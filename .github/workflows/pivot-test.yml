name: Meridian Pivot Test

on:
  workflow_dispatch:

jobs:
  test-pivot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Pivot files
        run: |
          echo "Pivot Event files:"
          ls -la pivot-event

      - name: Run Pivot prototype
        run: python3 pivot-event/app.py
